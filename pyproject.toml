[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odoo-boost"
dynamic = ["version"]
description = "AI coding agents with deep runtime introspection and static analysis for Odoo instances and addons via MCP tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Jan-Phillip Oesterling", email = "jappi2000@ewetel.net"},
]
maintainers = [
    {name = "Jan-Phillip Oesterling", email = "jappi2000@ewetel.net"},
]
keywords = [
    "odoo",
    "mcp",
    "ai",
    "coding-assistant",
    "boost",
    "antigravity",
    "claude-code",
    "cursor",
    "windsurf",
    "cline",
    "oca",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
    "mcp>=2.1.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "packaging>=24.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
lint = [
    "pylint>=3.2.0",
    "pylint-odoo>=10.0.11",
]
xml = [
    "lxml>=5.2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pylint>=3.2.0",
    "pylint-odoo>=10.0.11",
]
all = [
    "pylint>=3.2.0",
    "pylint-odoo>=10.0.11",
    "pyyaml>=6.0",
    "lxml>=5.2.0",
]

[project.scripts]
odoo-boost = "odoo_boost.cli.app:main"

[project.urls]
Homepage = "https://github.com/havmedia/odoo-boost"
Repository = "https://github.com/havmedia/odoo-boost"

[tool.hatch.version]
path = "src/odoo_boost/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_boost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::getpass.GetPassWarning"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
disallow_untyped_defs = true
strict_equality = true

[tool.coverage.run]
source = ["odoo_boost"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
