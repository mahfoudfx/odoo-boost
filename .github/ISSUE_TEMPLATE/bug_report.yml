name: Bug report
description: Report a reproducible problem with Odoo Boost
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please **redact credentials**
        (`password`, `mcp_token`) from any config or logs you paste.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `odoo-boost install`
        2. ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Odoo Boost version
      description: Output of `odoo-boost --version`
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: AI agent / IDE
      options:
        - Antigravity
        - Claude Code
        - Cursor
        - GitHub Copilot / VS Code
        - OpenAI Codex
        - OpenCode
        - Pi
        - Hermes
        - Windsurf
        - Cline
        - Junie
        - Not agent-specific
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, whether you use WSL, Python version, Odoo version, transport (stdio/HTTP)
      placeholder: "Windows 11 + WSL2 Ubuntu, Python 3.12, Odoo 18, HTTP transport"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Re-run with `--log-level DEBUG` if possible.
      render: shell
    validations:
      required: false
