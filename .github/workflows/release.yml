name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build & Publish
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/odoo-boost/
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "exec(open('src/odoo_boost/__version__.py').read()); print(__version__)")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match __version__ $VERSION"
            exit 1
          fi
          echo "Releasing odoo-boost $VERSION"

      - name: Build sdist & wheel
        run: uv build

      - name: Smoke test the built wheel
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import importlib.resources
          import odoo_boost
          from odoo_boost.skills.loader import list_skills
          from odoo_boost.mcp_server.server import create_mcp_server  # noqa: F401

          assert odoo_boost.__version__, "missing version"
          assert len(list_skills()) == 20, f"expected 20 skills, got {len(list_skills())}"
          for rel in (
              ("guidelines", "core", "coding_style.md"),
              ("guidelines", "core", "versions", "v18.md"),
              ("skills", "creating_models", "SKILL.md"),
          ):
              assert importlib.resources.files("odoo_boost").joinpath(*rel).is_file(), rel
          print("wheel smoke OK")
          PY
          /tmp/smoke/bin/odoo-boost --version

      - name: Publish to PyPI (Trusted Publishing)
        if: vars.PUBLISH_TO_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

      - name: PyPI publish skipped
        if: vars.PUBLISH_TO_PYPI != 'true'
        run: |
          echo "::notice::Skipping PyPI publish. Set the repository variable PUBLISH_TO_PYPI=true once the trusted publisher is configured."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
